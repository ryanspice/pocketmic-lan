name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug lintDebug test
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pocketmic-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish receiver
        working-directory: windows-receiver
        run: dotnet publish -c Release -r win-x64 --self-contained false
      - name: Run tests
        working-directory: windows-receiver-tests
        run: dotnet test
