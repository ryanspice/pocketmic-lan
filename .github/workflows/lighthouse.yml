name: Lighthouse

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lighthouse:
    name: Lighthouse audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse CI
        run: npm install -g @lhci/cli

      - name: Run Lighthouse
        run: |
          lhci collect --staticDistDir=./web --numberOfRuns=1
          lhci assert --assertions.categories:performance='["warn",{"minScore":0.9}]' --assertions.categories:accessibility='["warn",{"minScore":0.9}]' --assertions.categories:seo='["warn",{"minScore":0.9}]' --assertions.categories:best-practices='["warn",{"minScore":0.9}]'
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
          LHCI_BUILD_CONTEXT__COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
