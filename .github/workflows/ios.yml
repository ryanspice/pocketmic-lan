name: iOS

on:
  push:
    branches: [master, 'codex/**']
    tags: ['v*']
  pull_request:
    branches: [master]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  ios:
    name: iOS — build
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Validate Apple localization catalog
        run: python3 localization/validate_apple_catalog.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate --spec ios/project.yml --project ios

      - name: Verify Xcode 26 or newer
        run: |
          xcodebuild -version
          version="$(xcodebuild -version | awk '/^Xcode / { print $2 }')"
          major="${version%%.*}"
          if [[ "$major" -lt 26 ]]; then
            echo "Xcode 26 or newer is required; found $version"
            exit 1
          fi

      - name: Cache Swift package dependencies
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: swiftpm-${{ runner.os }}-${{ hashFiles('ios/**/*.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved', 'ios/Package.swift', 'ios/Package.resolved') }}
          restore-keys: swiftpm-${{ runner.os }}-

      - name: Resolve Swift package dependencies
        run: xcodebuild -resolvePackageDependencies -project ios/PocketMic.xcodeproj -scheme PocketMic

      - name: Build for iOS Simulator
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: >-
          xcodebuild -project ios/PocketMic.xcodeproj -scheme PocketMic
          -sdk iphonesimulator -configuration Debug
          -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO build

      - name: Test shared protocol vectors on iOS Simulator
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin); print(next((device["udid"] for devices in data["devices"].values() for device in devices if device["isAvailable"] and device["name"].startswith("iPhone")), ""))')"
          if [[ -z "$device_id" ]]; then
            echo "No available iPhone Simulator device was found."
            exit 1
          fi
          xcodebuild test -project ios/PocketMic.xcodeproj -scheme PocketMic \
            -destination "platform=iOS Simulator,id=${device_id}" \
            -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO

      - name: Verify simulator app localization bundle
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        run: python3 localization/verify_apple_bundle.py --platform ios build/DerivedData/Build/Products/Debug-iphonesimulator/PocketMic.app

      - name: Archive unsigned app
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: >-
          xcodebuild -project ios/PocketMic.xcodeproj -scheme PocketMic
          -configuration Release -destination 'generic/platform=iOS'
          -archivePath build/PocketMic.xcarchive CODE_SIGNING_ALLOWED=NO archive

      - name: Verify archive app localization bundle
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        run: python3 localization/verify_apple_bundle.py --platform ios build/PocketMic.xcarchive/Products/Applications/PocketMic.app

      - name: Upload simulator build
        if: github.event_name != 'release' && !startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pocketmic-ios-simulator-${{ github.sha }}
          path: build/DerivedData/Build/Products/Debug-iphonesimulator/PocketMic.app
          if-no-files-found: error
          retention-days: 14

      - name: Upload unsigned archive
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: pocketmic-ios-unsigned-archive-${{ github.ref_name }}
          path: build/PocketMic.xcarchive
          if-no-files-found: error
          retention-days: 30
