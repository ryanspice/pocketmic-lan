name: PocketMicMac
options:
  bundleIdPrefix: com.canopydigital
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "13.0"
targets:
  PocketMicMac:
    type: application
    platform: macOS
    sources:
      - path: Sources/PocketMicMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canopydigital.pocketmic.mac
        PRODUCT_NAME: PocketMic
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "6"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PocketMic
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en-CA
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: PocketMic receives encrypted microphone audio from a paired device on your local network.
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - PocketMicMacTests
  PocketMicMacTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/PocketMicMacTests
    dependencies:
      - target: PocketMicMac
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/PocketMic.app/Contents/MacOS/PocketMic
        BUNDLE_LOADER: $(TEST_HOST)
