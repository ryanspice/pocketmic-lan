<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4f1ea"/>
      <stop offset="100%" stop-color="#efeae0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#b88a3b"/>
      <stop offset="100%" stop-color="#d4a95c"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Gold accent stripe -->
  <rect x="0" y="0" width="8" height="630" fill="url(#gold)"/>
  <!-- Decorative circles -->
  <circle cx="1050" cy="100" r="200" fill="rgba(184,138,59,0.07)"/>
  <circle cx="1100" cy="550" r="150" fill="rgba(61,122,107,0.06)"/>
  <!-- Microphone icon -->
  <g transform="translate(80, 200)" fill="none" stroke="#b88a3b" stroke-width="6" stroke-linecap="round">
    <rect x="18" y="0" width="54" height="72" rx="18" fill="rgba(184,138,59,0.12)"/>
    <path d="M27 60a27 27 0 0 0 54 0"/>
    <line x1="45" y1="87" x2="45" y2="108"/>
    <line x1="27" y1="108" x2="63" y2="108"/>
  </g>
  <!-- Lock icon -->
  <g transform="translate(80, 370)" fill="none" stroke="#3d7a6b" stroke-width="4" stroke-linecap="round">
    <rect x="8" y="20" width="36" height="28" rx="6" fill="rgba(61,122,107,0.1)"/>
    <path d="M16 20V12a12 12 0 0 1 24 0v8"/>
  </g>
  <!-- Text -->
  <text x="180" y="230" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="72" font-weight="800" fill="#1a1712" letter-spacing="-2">
    PocketMic LAN
  </text>
  <text x="180" y="290" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="32" font-weight="600" fill="#8a6523" letter-spacing="-0.5">
    Encrypted Phone Microphone for Windows
  </text>
  <text x="180" y="350" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#6d6659">
    48 kHz mono PCM16 · AES-256-GCM · LAN only
  </text>
  <!-- Stats badges -->
  <g transform="translate(180, 400)">
    <rect x="0" y="0" width="130" height="55" rx="10" fill="white" stroke="#e3ddcf" stroke-width="1.5"/>
    <text x="65" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="800" fill="#1a1712">48 kHz</text>
    <text x="65" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d6659">mono PCM16</text>

    <rect x="145" y="0" width="130" height="55" rx="10" fill="white" stroke="#e3ddcf" stroke-width="1.5"/>
    <text x="210" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="800" fill="#1a1712">10 ms</text>
    <text x="210" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d6659">UDP packets</text>

    <rect x="290" y="0" width="175" height="55" rx="10" fill="white" stroke="#e3ddcf" stroke-width="1.5"/>
    <text x="377" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="16" font-weight="800" fill="#1a1712">AES-256-GCM</text>
    <text x="377" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d6659">authenticated</text>

    <rect x="480" y="0" width="130" height="55" rx="10" fill="white" stroke="#e3ddcf" stroke-width="1.5"/>
    <text x="545" y="24" text-anchor="middle" font-family="ui-monospace, monospace" font-size="18" font-weight="800" fill="#1a1712">LAN only</text>
    <text x="545" y="44" text-anchor="middle" font-family="system-ui, sans-serif" font-size="12" fill="#6d6659">private network</text>
  </g>
  <!-- Version badge -->
  <rect x="1020" y="30" width="120" height="36" rx="18" fill="none" stroke="#b88a3b" stroke-width="1.5"/>
  <text x="1080" y="54" text-anchor="middle" font-family="ui-monospace, monospace" font-size="14" font-weight="700" fill="#8a6523">v0.1.4</text>
  <!-- Footer -->
  <text x="180" y="580" font-family="system-ui, sans-serif" font-size="16" fill="#9a9283">
    MIT Licensed · github.com/canopydigital/pocketmic-lan
  </text>
</svg>
