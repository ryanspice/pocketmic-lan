name: PocketMic
options:
  bundleIdPrefix: com.canopydigital
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PocketMic:
    type: application
    platform: iOS
    sources:
      - path: Sources/PocketMic
      - path: ../localization/apple/Localizable.xcstrings
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.canopydigital.pocketmic
        INFOPLIST_KEY_CFBundleDevelopmentRegion: en-CA
        MARKETING_VERSION: "0.1.6"
        CURRENT_PROJECT_VERSION: "6"
        PRODUCT_NAME: PocketMic
        INFOPLIST_KEY_CFBundleDisplayName: PocketMic
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Generated/Info.plist
      properties:
        CFBundleDevelopmentRegion: en-CA
        NSMicrophoneUsageDescription: PocketMic captures your voice and streams it to a PocketMic receiver over your local network.
        NSLocalNetworkUsageDescription: PocketMic sends encrypted microphone audio to a receiver on your local network.
