name: PocketMic
options:
  bundleIdPrefix: com.ryanspice
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PocketMic:
    type: application
    platform: iOS
    sources:
      - path: Sources/PocketMic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanspice.pocketmic
        PRODUCT_NAME: PocketMic
        INFOPLIST_KEY_CFBundleDisplayName: PocketMic
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    info:
      path: Generated/Info.plist
      properties:
        NSMicrophoneUsageDescription: PocketMic captures your voice and streams it to your Windows receiver over your local network.
        NSLocalNetworkUsageDescription: PocketMic sends encrypted microphone audio to your receiver on your local network.
